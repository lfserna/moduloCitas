<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Linki Health{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('public.index') }}">
            <span class="brand-mark">L</span>
            <span>
                <strong>Linki Health</strong>
                <small>Programación de citas</small>
            </span>
        </a>
        <nav class="nav-actions" aria-label="Menú principal">
            <a href="{{ url_for('public.reservar') }}"><span class="nav-icon">＋</span><span>Reservar</span></a>
            <a href="{{ url_for('admin.dashboard') }}"><span class="nav-icon">▦</span><span>Dashboard</span></a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <span>Demo técnica para módulo de programación de citas médicas.</span>
        <button class="theme-toggle" type="button" id="themeToggle" aria-label="Cambiar modo claro u oscuro">
            <span class="theme-icon sun">☀</span>
            <span class="theme-icon moon">☾</span>
            <span id="themeText">Modo oscuro</span>
        </button>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
